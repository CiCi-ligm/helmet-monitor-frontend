<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>头盔设备</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,"Microsoft Yahei"}
        html,body{background:#f6f7f9;min-height:100%;padding-bottom:60px}
        .header{padding:20px 15px;font-size:24px;font-weight:600;color:#2563eb;background:#f6f7f9}
        .device-card{
            background:#fff;border-radius:16px;
            margin:0 15px 15px;padding:20px;
            box-shadow:0 2px 8px rgba(0,0,0,0.03);
        }
        .device-name{font-size:18px;font-weight:600;margin-bottom:15px}
        .status-item{
            display:flex;justify-content:space-between;
            padding:12px 0;border-bottom:1px solid #f0f0f0;
            font-size:15px;
        }
        .status-item:last-child{border-bottom:none}
        .status-online{color:#10b981}
        .status-offline{color:#ef4444}

        .sensor-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:0 15px;margin-bottom:15px}
        .sensor-card{
            background:#fff;border-radius:16px;padding:16px;
            text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.03)
        }
        .sensor-icon{font-size:30px;margin-bottom:8px}
        .sensor-value{font-size:28px;font-weight:bold;color:#333}
        .sensor-unit{font-size:12px;color:#999;margin-left:3px}
        .sensor-label{font-size:13px;color:#666;margin-top:4px}
        .sensor-time{font-size:10px;color:#bbb;margin-top:6px}
        .refresh-btn{
            width:calc(100% - 30px);margin:0 15px 15px;padding:12px;
            background:#2196F3;color:#fff;border:none;border-radius:12px;
            font-size:15px;cursor:pointer
        }

        .tab-bar{
            position:fixed;bottom:0;left:0;right:0;height:60px;
            background:#fff;border-top:1px solid #eee;
            display:flex;justify-content:space-around;align-items:center;
            z-index:999;
        }
        .tab-item{
            display:flex;flex-direction:column;align-items:center;
            font-size:12px;color:#666;text-decoration:none;gap:4px;
        }
        .tab-item.active{color:#2563eb}
        .tab-item .icon{font-size:22px}
    </style>
</head>
<body>
    <div class="header">⛑️ 头盔设备</div>
    
    <div class="device-card">
        <div class="device-name">智能骑行头盔 #001</div>
        <div class="status-item">
            <span>设备状态</span>
            <span class="status-online">● 在线</span>
        </div>
        <div class="status-item">
            <span>电池电量</span>
            <span>78%</span>
        </div>
        <div class="status-item">
            <span>GPS信号</span>
            <span>良好</span>
        </div>
        <div class="status-item">
            <span>今日骑行</span>
            <span>3.2km / 12分钟</span>
        </div>
    </div>

    <div class="sensor-grid">
        <div class="sensor-card">
            <div class="sensor-icon">🩸</div>
            <div>
                <span class="sensor-value" id="spo2Value">--</span>
                <span class="sensor-unit">%</span>
            </div>
            <div class="sensor-label">血氧饱和度</div>
            <div class="sensor-time" id="spo2Time">--</div>
        </div>
        <div class="sensor-card">
            <div class="sensor-icon">💓</div>
            <div>
                <span class="sensor-value" id="heartValue">--</span>
                <span class="sensor-unit">bpm</span>
            </div>
            <div class="sensor-label">心率</div>
            <div class="sensor-time" id="heartTime">--</div>
        </div>
        <div class="sensor-card">
            <div class="sensor-icon">🌡️</div>
            <div>
                <span class="sensor-value" id="tempValue">--</span>
                <span class="sensor-unit">°C</span>
            </div>
            <div class="sensor-label">体温</div>
            <div class="sensor-time" id="tempTime">--</div>
        </div>
        <div class="sensor-card">
            <div class="sensor-icon">☀️</div>
            <div>
                <span class="sensor-value" id="lightValue">--</span>
                <span class="sensor-unit">lux</span>
            </div>
            <div class="sensor-label">光照强度</div>
            <div class="sensor-time" id="lightTime">--</div>
        </div>
    </div>

    <button class="refresh-btn" onclick="fetchSensorData()">🔄 刷新传感器数据</button>

    <div class="tab-bar">
        <a href="nav.html" class="tab-item"><span class="icon">🗺️</span><span>导航</span></a>
        <a href="blind.html" class="tab-item active"><span class="icon">⛑️</span><span>头盔</span></a>
        <a href="record.html" class="tab-item"><span class="icon">📋</span><span>记录</span></a>
        <a href="profile.html" class="tab-item"><span class="icon">👤</span><span>我的</span></a>
    </div>

    <script>
        const AI_BACKEND_URL = 'https://www.helmet-ai.asia';

        async function fetchSensorData() {
            try {
                const resp = await fetch(`${AI_BACKEND_URL}/api/device/sensors`);
                const data = await resp.json();
                
                if (data.success) {
                    const s = data.sensors;
                    
                    document.getElementById('spo2Value').innerText = s.spo2.value;
                    document.getElementById('spo2Time').innerText = formatTime(s.spo2.time);
                    
                    document.getElementById('heartValue').innerText = s.heart_rate.value;
                    document.getElementById('heartTime').innerText = formatTime(s.heart_rate.time);
                    
                    document.getElementById('tempValue').innerText = s.temperature.value;
                    document.getElementById('tempTime').innerText = formatTime(s.temperature.time);
                    
                    document.getElementById('lightValue').innerText = s.light.value;
                    document.getElementById('lightTime').innerText = formatTime(s.light.time);
                }
            } catch (e) {
                console.error('获取传感器数据失败:', e);
            }
        }

        function formatTime(timestamp) {
            if (!timestamp) return '--';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        fetchSensorData();
        setInterval(fetchSensorData, 10000);
    </script>
</body>
</html>
