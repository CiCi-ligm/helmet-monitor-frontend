<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>导航</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,"Microsoft Yahei"}
        html,body{height:100%;background:#f6f7f9}
        .page-content{padding-bottom:60px;height:100%;display:flex;flex-direction:column}
        .header{padding:15px 20px;font-size:20px;font-weight:600;color:#2563eb;background:#fff;border-bottom:1px solid #eee}
        .main{flex:1;padding:15px;overflow-y:auto}
        .input-bar{display:flex;gap:10px;margin-bottom:12px}
        input{flex:1;height:44px;padding:0 14px;border:1px solid #ddd;border-radius:8px;font-size:15px}
        .btn-group{display:flex;gap:10px;margin-bottom:12px}
        button{height:44px;padding:0 16px;border:none;border-radius:8px;background:#2563eb;color:white;font-size:15px;cursor:pointer}
        button.gray{background:#6b7280}
        #map{width:100%;height:400px;border-radius:12px;border:1px solid #e0e0e0}
        #info{padding:14px;background:#f3f4f6;border-radius:8px;font-size:14px;margin-top:10px}

        /* 底部Tab导航栏 */
        .tab-bar{
            position:fixed;bottom:0;left:0;right:0;height:60px;
            background:#fff;border-top:1px solid #eee;
            display:flex;justify-content:space-around;align-items:center;
            z-index:999;
        }
        .tab-item{
            display:flex;flex-direction:column;align-items:center;
            font-size:12px;color:#666;text-decoration:none;gap:4px;
        }
        .tab-item.active{color:#2563eb}
        .tab-item .icon{font-size:22px}
    </style>
    <script src="https://webapi.amap.com/maps?v=2.0&key=977b6123358698744cd4f2a96e219145&plugin=AMap.Geolocation,AMap.Walking"></script>
</head>
<body>
    <div class="page-content">
        <div class="header">🚴 智能头盔导航</div>
        <div class="main">
            <div class="input-bar">
                <input id="to" placeholder="输入目的地：学校、家、医院...">
            </div>
            <div class="btn-group">
                <button onclick="getPos()">定位我的位置</button>
                <button onclick="goNav()">开始导航</button>
                <button class="gray" onclick="clearMap()">清空</button>
            </div>
            <div id="map"></div>
            <div id="info">欢迎使用智能头盔导航系统</div>
        </div>
    </div>

    <!-- 底部Tab栏 -->
    <div class="tab-bar">
        <a href="nav.html" class="tab-item active">
            <span class="icon">🗺️</span>
            <span>导航</span>
        </a>
        <a href="blind.html" class="tab-item">
            <span class="icon">⛑️</span>
            <span>头盔</span>
        </a>
        <a href="record.html" class="tab-item">
            <span class="icon">📋</span>
            <span>记录</span>
        </a>
        <a href="profile.html" class="tab-item">
            <span class="icon">👤</span>
            <span>我的</span>
        </a>
    </div>

<script>
let map, marker, currentLng, currentLat;

window.onload = function(){
    map = new AMap.Map("map", { 
        zoom: 16, 
        resizeEnable: true,
        center: [104.5647, 28.7658]
    });
};

// 手机浏览器定位（唯一位置来源，不读硬件GPS）
function getPos(){
    const info = document.getElementById("info");
    info.innerHTML = "⏳ 正在获取你的位置...";

    let geolocation = new AMap.Geolocation({
        enableHighAccuracy: true, 
        timeout: 10000
    });

    geolocation.getCurrentPosition((status, result) => {
        if(status === "complete" && result && result.position) {
            currentLng = result.position.lng;
            currentLat = result.position.lat;
            
            if(marker) marker.remove();
            
            marker = new AMap.Marker({
                position: new AMap.LngLat(currentLng, currentLat),
                title: "你的位置",
                icon: new AMap.Icon({
                    size: new AMap.Size(30, 30),
                    imageSize: new AMap.Size(30, 30),
                    image: "//a.amap.com/jsapi_demos/static/demo-center/icons/poi-marker-default.png"
                })
            });
            marker.setMap(map);
            map.setCenter([currentLng, currentLat]);
            
            info.innerHTML = `✅ 已定位<br>📍 ${result.formattedAddress || "未知地址"}`;
        } else {
            info.innerHTML = "❌ 定位失败：请打开定位权限或检查网络";
        }
    });
}

// 开始步行导航
function goNav() {
    if (!currentLng || !currentLat) {
        document.getElementById("info").innerHTML = "⚠️ 请先点击【定位我的位置】";
        return;
    }
    
    let to = document.getElementById("to").value.trim();
    if (!to) {
        document.getElementById("info").innerHTML = "⚠️ 请输入目的地";
        return;
    }
    
    document.getElementById("info").innerHTML = `⏳ 正在规划步行路线到：${to}`;

    AMap.plugin(["AMap.Walking"], function() {
        let walking = new AMap.Walking({
            map: map,
            autoFitView: true
        });

        walking.search(
            [currentLng, currentLat],
            [to, "宜宾市"]
        , function(status, result) {
            if (status === "complete" && result && result.info === "OK") {
                document.getElementById("info").innerHTML = `✅ 步行路线已生成<br>🎯 目的地：${to}<br>📏 距离：${result.route.distance/1000} km`;
            } else {
                document.getElementById("info").innerHTML = "❌ 找不到路线，请换个关键词试试";
            }
        });
    });
}

function clearMap(){
    map.clearMap();
    document.getElementById("info").innerHTML = "🗑️ 已清空地图";
}
</script>
</body>
</html>
