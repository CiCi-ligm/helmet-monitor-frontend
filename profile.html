<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,"Microsoft Yahei"}
        html,body{height:100%;background:#f6f7f9}
        .page-content{padding-bottom:60px;min-height:100%}
        .user-header{
            background:#2563eb;color:white;
            padding:60px 20px 40px;
            text-align:center;
        }
        .avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.2);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:40px}
        .user-name{font-size:20px;font-weight:500}

        .menu-list{
            background:#fff;border-radius:16px;
            margin:15px;overflow:hidden;
            display:flex;flex-direction:column;
        }
        .menu-item{
            padding:18px 20px;
            display:flex;justify-content:space-between;align-items:center;
            font-size:16px;border-bottom:1px solid #f0f0f0;
            cursor:pointer;
        }
        .menu-item:last-child{border-bottom:none}
        .menu-item .arrow{color:#999}
        .menu-item .switch{color:#2563eb}

        .logout-btn{
            margin:30px 15px;
            height:50px;
            background:#ef4444;color:white;
            border:none;border-radius:12px;
            font-size:16px;width:calc(100% - 30px);
            cursor:pointer;
        }

        /* 底部Tab导航栏 */
        .tab-bar{
            position:fixed;bottom:0;left:0;right:0;height:60px;
            background:#fff;border-top:1px solid #eee;
            display:flex;justify-content:space-around;align-items:center;
            z-index:999;
        }
        .tab-item{
            display:flex;flex-direction:column;align-items:center;
            font-size:12px;color:#666;text-decoration:none;gap:4px;
        }
        .tab-item.active{color:#2563eb}
        .tab-item .icon{font-size:22px}
    </style>
</head>
<body>
    <div class="page-content">
        <div class="user-header">
            <div class="avatar">👤</div>
            <div class="user-name">欢迎你，C</div>
        </div>

        <div class="menu-list">
            <div class="menu-item">
                <span>头盔设备</span>
                <span class="arrow">></span>
            </div>
            <div class="menu-item" onclick="location.href='record.html'">
                <span>骑行记录</span>
                <span class="arrow">></span>
            </div>
            <div class="menu-item" onclick="location.href='pay.html'">
                <span>会员充值</span>
                <span class="arrow">></span>
            </div>
            <div class="menu-item">
                <span>深色模式</span>
                <span class="switch">切换</span>
            </div>
        </div>

        <button class="logout-btn">退出登录</button>
    </div>

    <!-- 底部Tab栏 -->
    <div class="tab-bar">
        <a href="nav.html" class="tab-item">
            <span class="icon">🗺️</span>
            <span>导航</span>
        </a>
        <a href="blind.html" class="tab-item">
            <span class="icon">⛑️</span>
            <span>头盔</span>
        </a>
        <a href="record.html" class="tab-item">
            <span class="icon">📋</span>
            <span>记录</span>
        </a>
        <a href="profile.html" class="tab-item active">
            <span class="icon">👤</span>
            <span>我的</span>
        </a>
    </div>
</body>
</html>
