<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>智能头盔导航</title>

  <script>
    window._AMapSecurityConfig = {
      securityJsCode: "fc5eab52eb041ff4874aba0dd149d954"
    };
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=977b6123358698744cd4f2a96e219145&plugin=AMap.AutoComplete,AMap.Geolocation,AMap.Walking,AMap.Riding"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, "Microsoft Yahei";
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    #container {
      width: 100%;
      height: 100vh;
    }

    .input-box {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: #fff;
      padding: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .input-box input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 10px;
      outline: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn-group button {
      flex: 1;
      padding: 10px;
      background: #1677ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-group button.gray {
      background: #6b7280;
    }

    .float-btn {
      position: fixed;
      z-index: 9999;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.95);
      border: none;
      border-radius: 24px;
      font-size: 14px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
      cursor: pointer;
    }
    #switchMapBtn {
      top: 130px;
      right: 12px;
    }
    #locateBtn {
      top: 180px;
      right: 12px;
    }

    #custom-suggest-list {
      position: fixed;
      top: 120px;
      left: 12px;
      right: 12px;
      z-index: 9998;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      max-height: 240px;
      overflow-y: auto;
      display: none;
    }
    #custom-suggest-list .item {
      padding: 12px 12px 12px 36px;
      font-size: 15px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      position: relative;
    }
    #custom-suggest-list .item::before {
      content: "📍";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
    }
    #custom-suggest-list .item:last-child {
      border-bottom: none;
    }

    #info {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <div class="input-box">
    <input id="addressInp" placeholder="输入目的地" />
    <div class="btn-group">
      <button id="locateBtn2">定位我的位置</button>
      <button id="walkBtn">步行导航</button>
      <button id="rideBtn">骑行导航</button>
      <button id="clearBtn" class="gray">清空</button>
    </div>
  </div>

  <button class="float-btn" id="switchMapBtn">切换卫星图</button>
  <div id="custom-suggest-list"></div>
  <div id="info">欢迎使用导航系统</div>

  <script>
    let map;
    let marker = null;
    let currentPos = null;
    let targetLocation = null;
    let walkingInstance = null;
    let ridingInstance = null;
    let isSatellite = false;
    let satelliteLayer = null;

    const info = document.getElementById('info');
    const addressInp = document.getElementById('addressInp');
    const customSuggestList = document.getElementById('custom-suggest-list');

    // 初始化地图
    window.onload = function(){
      map = new AMap.Map("container", {
        zoom: 16,
        resizeEnable: true,
        center: [104.5647, 28.7658]
      });
      satelliteLayer = new AMap.TileLayer.Satellite();
      initAutoComplete();
      bindEvents();
    };

    // 绑定事件
    function bindEvents() {
      document.getElementById('locateBtn2').addEventListener('click', getMyLocation);
      document.getElementById('walkBtn').addEventListener('click', () => startNav('walking'));
      document.getElementById('rideBtn').addEventListener('click', () => startNav('riding'));
      document.getElementById('clearBtn').addEventListener('click', clearMap);
      document.getElementById('switchMapBtn').addEventListener('click', switchMapType);
    }

    // 手机定位
    function getMyLocation(){
      info.innerHTML = "⏳ 正在获取你的位置...";
      let geolocation = new AMap.Geolocation({
        enableHighAccuracy: true,
        timeout: 10000
      });

      geolocation.getCurrentPosition((status, result) => {
        if(status === "complete" && result && result.position) {
          currentPos = result.position;

          if(marker) marker.remove();
          marker = new AMap.Marker({ position: currentPos });
          marker.setMap(map);
          map.setCenter(currentPos);

          info.innerHTML = `✅ 已定位<br>📍 ${result.formattedAddress || "未知地址"}`;
        } else {
          info.innerHTML = "❌ 定位失败：请打开定位权限或检查网络";
        }
      });
    }

    // 开始导航
    function startNav(mode) {
      if (!currentPos) {
        info.innerHTML = "⚠️ 请先点击【定位我的位置】";
        return;
      }
      let to = addressInp.value.trim();
      if (!to) {
        info.innerHTML = "⚠️ 请输入目的地";
        return;
      }

      info.innerHTML = `⏳ 正在规划${mode === 'walking' ? '步行' : '骑行'}路线到：${to}`;

      const plugin = mode === 'walking' ? 'AMap.Walking' : 'AMap.Riding';
      AMap.plugin(plugin, function() {
        if (walkingInstance) walkingInstance.clear();
        if (ridingInstance) ridingInstance.clear();

        const instance = mode === 'walking'
          ? new AMap.Walking({ map: map, autoFitView: true })
          : new AMap.Riding({ map: map, autoFitView: true });

        mode === 'walking' ? walkingInstance = instance : ridingInstance = instance;

        instance.search(currentPos, [to, "宜宾市"], function(status, result) {
          if (status === "complete" && result && result.info === "OK") {
            const route = result.routes[0];
            info.innerHTML = `✅ ${mode === 'walking' ? '步行' : '骑行'}路线已生成<br>🎯 目的地：${to}<br>📏 距离：${route.distance/1000} km<br>⏱️ 预计：${Math.round(route.duration/60)} 分钟`;
          } else {
            info.innerHTML = "❌ 找不到路线，请换个关键词试试";
          }
        });
      });
    }

    // 目的地联想搜索
    function initAutoComplete() {
      let autoComplete = new AMap.AutoComplete({ city: "宜宾" });
      let timer = null;

      addressInp.addEventListener('input', function() {
        const keyword = this.value.trim();
        if (!keyword) { customSuggestList.style.display = 'none'; return; }
        clearTimeout(timer);
        timer = setTimeout(() => {
          autoComplete.search(keyword, (status, result) => {
            if (status === 'complete' && result.tips) {
              customSuggestList.innerHTML = '';
              result.tips.forEach(tip => {
                if (!tip.location) return;
                const item = document.createElement('div');
                item.className = 'item';
                item.innerText = tip.name;
                item.onclick = () => {
                  addressInp.value = tip.name;
                  targetLocation = tip.location;
                  customSuggestList.style.display = 'none';
                };
                customSuggestList.appendChild(item);
              });
              customSuggestList.style.display = 'block';
            }
          });
        }, 300);
      });

      addressInp.addEventListener('blur', () => {
        setTimeout(() => customSuggestList.style.display = 'none', 200);
      });
    }

    // 切换卫星图
    function switchMapType() {
      if(!isSatellite){
        map.add(satelliteLayer);
        document.getElementById('switchMapBtn').innerText = '切换普通地图';
        isSatellite = true;
      }else{
        map.remove(satelliteLayer);
        document.getElementById('switchMapBtn').innerText = '切换卫星图';
        isSatellite = false;
      }
    }

    // 清空地图
    function clearMap(){
      if (walkingInstance) walkingInstance.clear();
      if (ridingInstance) ridingInstance.clear();
      if (marker) marker.remove();
      currentPos = null;
      targetLocation = null;
      addressInp.value = '';
      customSuggestList.style.display = 'none';
      info.innerHTML = "🗑️ 已清空地图";
    }
  </script>
</body>
</html>
