<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>智能头盔管理与导航</title>
  <script>
    window._AMapSecurityConfig = { securityJsCode: "fc5eab52eb041ff4874aba0dd149d954" };
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=977b6123358698744cd4f2a96e219145&plugin=AMap.AutoComplete,AMap.Geolocation,AMap.Walking,AMap.Riding"></script>
  <style>
    * {margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    html,body{height:100%;overflow:hidden;background:#f5f5f5}
    
    /* 地图容器 */
    #container{width:100%;height:100vh;background:#e5e5e5}
    
    /* 顶部面板：包含搜索框和功能按钮 */
    .top-panel {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 搜索框 */
    .search-box {
      display: flex;
      align-items: center;
      background: #f0f2f5;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .search-box input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 16px;
      outline: none;
      color: #333;
    }

    /* 功能按钮群（两列布局） */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .action-grid .full-width {
      grid-column: span 2;
    }
    .action-btn {
      padding: 10px;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: opacity 0.2s;
    }
    .action-btn:active { opacity: 0.8; }
    .btn-green { background: #4CAF50; }
    .btn-blue { background: #2196F3; }
    .btn-red { background: #F44336; }
    .btn-orange { background: #FF9800; }

    /* 导航选择按钮 */
    .btn-group{display:flex;gap:8px;}
    .btn-group button{flex:1;padding:10px;background:#1677ff;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;}
    .btn-group button.gray{background:#909399;}

    /* 切换卫星图悬浮按钮 (修复位置) */
    #switchMapBtn {
      position: fixed;
      top: 230px; /* 根据顶部面板高度调整 */
      right: 12px;
      z-index: 9998;
      padding: 8px 14px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 13px;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    /* 搜索建议列表 */
    #suggest-list {
      position: fixed;
      top: 60px; left: 12px; right: 12px;
      z-index: 9998;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      max-height: 260px;
      overflow-y: auto;
      display: none;
      border: 1px solid #eee;
    }
    #suggest-list .item{padding:12px 14px;font-size:15px;border-bottom:1px solid #f0f0f0;cursor:pointer;color:#333;}
    #suggest-list .highlight{color:#1677ff;font-weight:bold}

    /* 定位提示 */
    #tip{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;background:rgba(0,0,0,0.7);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;display:none;}

    /* 底部导航面板 */
    #nav-panel{position:fixed;left:12px;right:12px;bottom:75px;z-index:9998;background:#ffffff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,0.2);max-height:220px;overflow-y:auto;padding:14px;display:none;}
    .nav-step{padding:8px 0 8px 24px;font-size:14px;position:relative;color:#555;line-height:1.6;border-bottom:1px solid #f5f5f5;}
    .nav-step::before{content:"●";position:absolute;left:8px;top:9px;color:#ccc;font-size:12px;}
    .nav-step.active{color:#1677ff;font-weight:500;background:#f0f7ff;border-radius:8px;margin:3px 0;padding-left:24px;}
    .nav-step.active::before{color:#1677ff;content:"▶";font-size:10px;left:8px;top:10px;}

    /* 底部 Tab */
    .tab-bar{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;z-index:9999;}
    .tab-item{display:flex;flex-direction:column;align-items:center;font-size:12px;color:#666;text-decoration:none;gap:2px;}
    .tab-item.active{color:#2563eb}
    .tab-item .icon{font-size:22px}
  </style>
</head>
<body>
  <div id="container"></div>
  
  <!-- 顶部控制面板 -->
  <div class="top-panel">
    <div class="search-box">
      <span style="margin-right:8px;color:#999;">🔍</span>
      <input id="addressInput" placeholder="输入目的地或说出指令" />
    </div>
    
    <!-- 补全你截图里缺失的按钮 -->
    <div class="action-grid">
      <button class="action-btn btn-green" onclick="alert('开始录音识别...')">🎤 按住说话 (语音识别)</button>
      <button class="action-btn btn-blue" onclick="alert('硬件语音测试中...')">🎙️ 硬件语音识别测试</button>
      <button class="action-btn btn-red full-width" onclick="alert('已触发模拟摔倒检测！')">🆘 模拟摔倒检测</button>
      <button class="action-btn btn-orange full-width" onclick="alert('正在请求大模型进行综合评估...')">🚴 骑行前综合评估</button>
    </div>

    <div class="btn-group">
      <button onclick="startNav('walking')">步行导航</button>
      <button onclick="startNav('riding')">骑行导航</button>
      <button class="gray" onclick="clearAll()">清空</button>
    </div>
  </div>

  <!-- 其他组件 -->
  <button id="switchMapBtn" onclick="switchSatellite()">🛰️ 切换卫星图</button>
  <div id="suggest-list"></div>
  <div id="tip">正在定位...</div>
  
  <div id="nav-panel">
    <div id="nav-summary" style="font-weight:bold;margin-bottom:10px;color:#333;"></div>
    <div id="step-list"></div>
  </div>
  
  <div class="tab-bar">
    <span class="tab-item active"><span class="icon">🗺️</span><span>导航</span></span>
    <span class="tab-item"><span class="icon">🪖</span><span>头盔</span></span>
    <span class="tab-item"><span class="icon">📋</span><span>记录</span></span>
    <span class="tab-item"><span class="icon">👤</span><span>我的</span></span>
  </div>

  <script>
    let map, myMarker, currentPos, targetPos;
    let navSteps = [], currentStepIndex = 0, isNavigating = false, watchId = null;
    const ARRIVE_DIST = 30;
    let isSatellite = false; // 卫星图状态

    const tip = document.getElementById('tip');
    const addressInput = document.getElementById('addressInput');
    const suggestList = document.getElementById('suggest-list');
    const navPanel = document.getElementById('nav-panel');
    const navSummary = document.getElementById('nav-summary');
    const stepList = document.getElementById('step-list');

    window.onload = function(){
      map = new AMap.Map("container", { zoom: 16, resizeEnable: true, center: [104.5647, 28.7658] });
      initAutoComplete();
      getMyLocation();
    };

    // 补全你原本为空的卫星图切换逻辑
    function switchSatellite() {
      isSatellite = !isSatellite;
      if (isSatellite) {
        map.setLayers([new AMap.TileLayer.Satellite()]);
        document.getElementById('switchMapBtn').innerText = "🗺️ 切换标准图";
      } else {
        map.setLayers([new AMap.TileLayer()]);
        document.getElementById('switchMapBtn').innerText = "🛰️ 切换卫星图";
      }
    }

    // 下发指令到 OneNET
    function sendNavTextToCloud(text) {
      const url = "https://iot-api.heclouds.com/mqtt/thing/property/set?product_id=G2ddPjoILg&device_name=gps";
      const body = JSON.stringify({
        params: {
          nav_cmd: { value: text },
          llm_down_cmd: { value: "前方左转，请注意安全" }
        }
      });
      fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain",
          "Authorization": "Bearer zwcf9R9tkduLoePvpSEpg2XToeMNgU8NJyNridtN84s"
        },
        body: body
      }).catch(e => console.log("OneNET请求失败", e));
    }

    function getMyLocation(){
      tip.style.display = "block";
      new AMap.Geolocation({ enableHighAccuracy: true, timeout: 10000 }).getCurrentPosition((status, result) => {
        if(status === "complete" && result.position){
          currentPos = result.position;
          if(myMarker) myMarker.setMap(null);
          myMarker = new AMap.Marker({ position: currentPos });
          myMarker.setMap(map);
          map.setCenter(currentPos);
          tip.style.display = "none";
        } else { tip.innerText = "定位失败，请检查权限"; }
      });
    }

    function startWatchPosition(){
      if(watchId) navigator.geolocation.clearWatch(watchId);
      watchId = navigator.geolocation.watchPosition(
        (res) => {
          currentPos = new AMap.LngLat(res.coords.longitude, res.coords.latitude);
          if(myMarker) myMarker.setPosition(currentPos);
          checkNavStep();
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 2000 }
      );
    }

    function initAutoComplete(){
      const autoComplete = new AMap.AutoComplete({ city: "宜宾" });
      let timer = null;
      addressInput.addEventListener('input', function(){
        const keyword = this.value.trim();
        if(!keyword){ suggestList.style.display = "none"; return; }
        clearTimeout(timer);
        timer = setTimeout(()=>{
          autoComplete.search(keyword, (status, res) => {
            if(status === "complete" && res.tips && res.tips.length > 0){
              suggestList.innerHTML = "";
              res.tips.forEach(tipItem => {
                if(!tipItem.location) return;
                const div = document.createElement('div');
                div.className = "item";
                div.innerHTML = tipItem.name.replace(new RegExp(`(${keyword})`, 'gi'), '<span class="highlight">$1</span>');
                div.onclick = () => {
                  addressInput.value = tipItem.name;
                  targetPos = tipItem.location;
                  suggestList.style.display = "none";
                };
                suggestList.appendChild(div);
              });
              suggestList.style.display = "block";
            }
          });
        }, 300);
      });
      // 修复点击输入框外隐藏列表
      document.addEventListener('click', (e) => {
        if (!addressInput.contains(e.target) && !suggestList.contains(e.target)) {
          suggestList.style.display = "none";
        }
      });
    }

    function startNav(type){
      if(!currentPos || !targetPos) {
        alert("请先定位并选择目的地");
        return;
      }
      isNavigating = true; currentStepIndex = 0; navSteps = [];
      const plugin = type === 'walking' ? 'AMap.Walking' : 'AMap.Riding';
      AMap.plugin(plugin, ()=>{
        const route = new (type === 'walking' ? AMap.Walking : AMap.Riding)({ map, hideMarkers: true, autoFitView: true });
        route.search(currentPos, targetPos, (status, res) => {
          if(status === "complete" && res.routes && res.routes.length > 0){
            const routeData = res.routes[0];
            let stepArr = [], distance = 0, duration = 0;
            if(routeData.paths && routeData.paths.length > 0){
              stepArr = routeData.paths[0].steps;
              distance = routeData.paths[0].distance;
              duration = routeData.paths[0].time || routeData.paths[0].duration;
            } else if(routeData.steps && routeData.steps.length > 0){
              stepArr = routeData.steps;
              distance = routeData.distance;
              duration = routeData.time || routeData.duration;
            }
            navSteps = stepArr.map(s => ({
              text: s.instruction.replace(/<[^>]+>/g, ''),
              endPos: new AMap.LngLat(s.path[s.path.length-1].lng, s.path[s.path.length-1].lat)
            }));
            navSummary.innerHTML = '🎯 ' + addressInput.value + ' | ' + (type==='walking'?'步行':'骑行') + ' | ' + (distance/1000).toFixed(1) + 'km | 约' + Math.round(duration/60) + '分钟';
            stepList.innerHTML = navSteps.map((step, i) => '<div class="nav-step ' + (i===0?'active':'') + '">' + step.text + '</div>').join('');
            navPanel.style.display = "block";
            startWatchPosition();
            if(navSteps.length > 0){
              const firstNavText = '开始' + (type==='walking'?'步行':'骑行') + '导航，' + navSteps[0].text;
              sendNavTextToCloud(firstNavText);
              voiceSpeak(firstNavText);
            }
          } else { alert("路线规划失败"); }
        });
      });
    }

    function checkNavStep(){
      if(!isNavigating || navSteps.length === 0 || currentStepIndex >= navSteps.length) return;
      if(currentPos.distance(navSteps[currentStepIndex].endPos) < ARRIVE_DIST){
        currentStepIndex++;
        const items = stepList.querySelectorAll('.nav-step');
        items.forEach((el, idx) => el.classList.toggle('active', idx === currentStepIndex));
        if(currentStepIndex < navSteps.length){
          sendNavTextToCloud(navSteps[currentStepIndex].text);
          voiceSpeak(navSteps[currentStepIndex].text);
        } else {
          voiceSpeak("已到达目的地");
          endNav();
        }
      }
    }

    function endNav(){
      isNavigating = false; navSteps = [];
      if(watchId) navigator.geolocation.clearWatch(watchId);
      window.speechSynthesis.cancel();
      navPanel.style.display = "none";
    }

    function voiceSpeak(text) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = "zh-CN"; msg.rate = 1.1;
      speechSynthesis.speak(msg);
    }

    function clearAll(){
      addressInput.value = ""; targetPos = null;
      endNav();
      suggestList.style.display = "none";
    }
  </script>
</body>
</html>
